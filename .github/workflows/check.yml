name: Source and container checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-3.0 xvfb xauth shellcheck
      - name: Static checks
        run: bash build/check.sh
      - name: ShellCheck
        run: bash build/lint.sh
      - name: Tests including GTK state and PXE rendering
        run: xvfb-run -a bash build/unittest.sh
      - name: No whitespace errors
        run: git diff --check
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build PXE server
        run: docker build -f deploy/docker-pxe/Dockerfile -t thinclient-pxe:test .
      - name: Validate Compose
        run: docker compose -f deploy/docker-pxe/compose.yaml config --quiet
