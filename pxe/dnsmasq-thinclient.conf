# dnsmasq in proxy-DHCP mode: serves PXE boot information alongside an existing
# DHCP server (your Windows Server 2025 DHCP keeps handing out addresses; this
# box only answers the "what do I boot?" part). Nothing on the Windows side
# changes, which makes this the least invasive way to bring PXE up.
#
#   apt install dnsmasq
#   cp dnsmasq-thinclient.conf /etc/dnsmasq.d/thinclient.conf
#   edit the three marked values, then: systemctl restart dnsmasq
#
# For a full (non-proxy) DHCP server, delete the dhcp-range line below and use
#   dhcp-range=192.168.1.100,192.168.1.200,12h
#   dhcp-option=3,192.168.1.1      # gateway
#   dhcp-option=6,192.168.1.1      # DNS

# ---- EDIT THESE -------------------------------------------------------------
# The subnet this server is on, followed by the word "proxy".
dhcp-range=192.168.1.0,proxy
# Where the PXE files live (the out/pxe directory).
tftp-root=/srv/tftp
# This machine's address, used in the HTTP URLs below.
# (Also set it with render-configs.sh so the boot menus match.)
# -----------------------------------------------------------------------------

port=0                    # DNS off: we are only doing DHCP/PXE here
log-dhcp
enable-tftp

# Architecture-aware boot files. A modern PC boots UEFI x64 (arch 7 or 9);
# older kit and most VMs in "legacy" mode boot BIOS (arch 0).
pxe-service=x86PC,             "ThinClient (BIOS)",       pxelinux
pxe-service=BC_EFI,            "ThinClient (UEFI ia32)",  grub/i386-efi/core
pxe-service=X86-64_EFI,        "ThinClient (UEFI x64)",   grub/x86_64-efi/core
# Swap the x64 line for this one when clients keep Secure Boot enabled:
# pxe-service=X86-64_EFI,      "ThinClient (UEFI x64)",   bootx64

# Hand the configuration URL to the clients as DHCP option 224. The client
# fetches it at boot and every time a link comes up, so you can repoint a whole
# floor of thin clients by editing one file on the web server.
dhcp-option=224,"http://192.168.1.5/thinclient/config.json"

# Per-device configuration, the Wyse way: match on MAC, send a different URL.
# dhcp-host=aa:bb:cc:dd:ee:ff,set:reception
# dhcp-option=tag:reception,224,"http://192.168.1.5/thinclient/reception.json"
