# Remote support is key-only and limited to the dedicated support account.
# ssh.service has an additional condition: without a validated key imported
# from TCCONF at boot, the daemon never starts and port 22 remains closed.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers support
AuthorizedKeysFile /run/thinclient-support/user/authorized_keys

X11Forwarding no
# Covers TCP, agent, X11, Unix-domain socket, and tunnel forwarding in one
# fail-closed policy. The explicit settings remain easy to audit with sshd -T.
DisableForwarding yes
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
