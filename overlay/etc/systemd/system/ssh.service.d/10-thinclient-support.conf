[Unit]
After=tc-config.service
Requires=tc-config.service
ConditionPathExists=/run/thinclient-support/enabled

[Service]
# Host keys and authorized_keys are created per client by tc-fetch-config and
# live only in /run; their persistent originals stay on TCCONF.
ExecStartPre=/usr/bin/test -s /run/thinclient-support/user/authorized_keys
# Revoking physical authorization stops both the listener and existing support
# sessions instead of leaving sshd child processes alive.
KillMode=control-group
