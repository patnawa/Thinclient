# The connection manager runs as the unprivileged "thin" user and writes its
# runtime state here: the working configuration and the last session log.
# Created early by systemd-tmpfiles, before any ThinClient service starts.
#
# 1775 = group-writable with the sticky bit: "thin" can create its own files but
# cannot remove or replace the ones root put there (the fetched central config).
d /run/thinclient 1775 root thin -
d /media/tc       0755 root root -
