# Notice a dead server quickly.
#
# RDP already has its own liveness: the server sends heartbeat PDUs (FreeRDP
# supports them by default) and +auto-reconnect re-establishes a dropped
# session. Neither helps when the peer disappears without closing the socket -
# a switch reboot, a severed uplink, a server that panics. Linux would then sit
# on the dead connection for over two hours before giving up, and the user
# stares at a frozen desktop the whole time.
#
# 60s idle, then 3 probes 10s apart: a dead peer is detected in about 90
# seconds, and the client shows its reconnect prompt instead of a frozen image.
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 3
