# Hardware a thin client will never use. The floppy driver is the important one:
# on machines (and hypervisors) that advertise a controller with no drive, it
# retries block 0 forever and fills the log with I/O errors during boot.
blacklist floppy
blacklist pcspkr
blacklist snd_pcsp

# No modem, no parallel port, no game port.
blacklist lp
blacklist ppdev
blacklist parport_pc
blacklist joydev
