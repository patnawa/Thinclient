name: thinclient-pxe

x-pxe-image: &pxe-image
  image: ${PXE_IMAGE:-thinclient-pxe-server:1.3}
  build:
    context: ../..
    dockerfile: deploy/docker-pxe/Dockerfile
  network_mode: host
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  volumes:
    - type: bind
      source: ${PXE_ROOT:-../../out/pxe}
      target: /srv/pxe
      read_only: true

services:
  tftp:
    <<: *pxe-image
    command: ["tftp"]
    environment:
      TFTP_LISTEN: ${PXE_LISTEN:-0.0.0.0}:69
    tmpfs:
      - /run
      - /tmp

  http:
    <<: *pxe-image
    command: ["http"]
    user: "65534:65534"
    environment:
      HTTP_BIND: ${PXE_LISTEN:-0.0.0.0}
      HTTP_PORT: ${HTTP_PORT:-8080}
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://${PXE_LISTEN:-127.0.0.1}:${HTTP_PORT:-8080}/config.json', timeout=3).read(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
